experiment:
  name: llm-replacement-v1
  seed: 5300
  spend_cap_usd: null
fixed:
  paper2poster:
    workflow: latex-only-v2
    repo: https://github.com/Paper2Poster/Paper2Poster
    commit: 623d042f283acee782b2644d6abd63f75eccfa1f
    path: vendor/Paper2Poster
    python: vendor/Paper2Poster/.venv/bin/python
    vision_model: same_as_candidate
    poster_width_inches: 48
    poster_height_inches: 36
    institution_logo_path: assets/CornellLogo.png
    extra_args: []
    patch: patches/p2p-generation-params.patch
    max_output_tokens: 8192
    timeout_s: 3600
    max_parse_attempts: 2
  generation:
    temperature: 0
    seed: 5300
  papers_dir: papers/
  n_papers: 30
  attempts_per_pair: 1
  prices_file: config/prices.yaml
gateway:
  name: cornell-ai-gateway
  api_style: openai
  base_url_env: CORNELL_AI_GATEWAY_URL
  api_key_env: CORNELL_AI_GATEWAY_KEY
  timeout_s: 600
  max_transport_retries: 2
candidates:
- id: claude-opus-5
- id: gpt-5.6-sol
- id: meta.llama-4-maverick-17b-instruct
- id: qwen.qwen3-vl-235b-a22b
judges:
  models:
  - id: gemini-3.5-flash
    max_output_tokens: 32768
  - id: openai.gpt-4o
    max_output_tokens: 16384
  repeats: 2
judge_settings:
  temperature: 0
  max_output_tokens: 8192
  max_image_px: 2000
  claims_batch_size: 10
  paper_char_limit: 400000
  reference_fallback_chars: 100000
judge_validation:
  item_kappa_min: 0.6
  coverage_icc_min: 0.75
  halluc_icc_min: 0.6
  quality_wkappa_min: 0.6
  quality_within1_min: 0.9
  detection_min: 0.8
  retest_icc_min: 0.8
  evidence_found_min: 0.9
reference_sheets:
  models:
  - gemini-3.5-flash
  - openai.gpt-4o
  excerpt_chars: 2500
spec_limits:
  key_information_coverage:
    lsl: 90
  hallucination_rate:
    usl: 5.0
  poster_quality_score:
    lsl: 4.0
  workflow_success_rate:
    lsl: 95
  capability_threshold: 1.0
  confidence: 0.95
  bootstrap_reps: 2000
analysis:
  calibration_papers:
  - P06
  - P11
  - P13
  decision_basis: mean
  target_share: 0.75
  min_scored: 5
  seed: 5300
  judge_scores:
  - data/latex/remaining_p01_p15/judge_scores.csv
  - data/latex/gpt4o_calibration_2/judge_scores.csv
  human_scores:
  - data/latex/gpt4o_calibration_2/human_scores.csv
review_routing:
  near_limit_band:
    key_information_coverage:
    - 80
    - 100
    poster_quality_score:
    - 3.5
    - 4.5
  judge_disagree_margin:
    key_information_coverage: 15
    poster_quality_score: 1.0
  random_audit_share: 0.1
spc:
  p_chart_batch_size: 5
  sigma: 3
