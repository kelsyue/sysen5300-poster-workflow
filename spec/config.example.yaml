# Reference configuration for one experiment. Only `candidates` should differ
# between experiments; changing anything under `fixed` breaks comparability.

experiment:
  name: llm-replacement-v1
  seed: 5300                      # used for blinding/randomization, not generation
  spend_cap_usd: null             # TBD: set from project budget before the full run

fixed:
  paper2poster:
    repo: TBD                     # confirm upstream repo URL
    commit: TBD                   # pin before first run
    vision_model: TBD             # held constant across candidates (OI-1)
  prompt_file: prompts/generation_prompt.txt
  rubric_file: prompts/judge_rubric.txt
  generation:
    temperature: 0
    max_output_tokens: TBD
    prompt_caching: true
  papers_dir: papers/
  n_papers: 30
  attempts_per_pair: 1            # raise if budget allows (see OI-4)

gateway:
  name: cornell-ai-gateway        # Cornell AI Platform -> AI Gateway (assumed LiteLLM proxy)
  api_style: openai               # OpenAI-compatible /v1 endpoints (confirm, OI-16)
  base_url_env: CORNELL_AI_GATEWAY_URL
  api_key_env: CORNELL_AI_GATEWAY_KEY
  timeout_s: 600
  max_transport_retries: 2        # OI-6

candidates:                       # run order = list order (alphabetical)
  - id: claude-opus-5
  - id: gpt-5.6-sol
  - id: meta.llama-4-maverick-17b-instruct
  - id: qwen.qwen3-vl-235b-a22b

judges:
  models:
    - id: TBD-gemini-flash        # exact gateway ID
    - id: gpt-4o                  # confirm exact gateway ID
  repeats: 2                      # test-retest on the pilot

spec_limits:
  key_information_coverage: { lsl: 90 }
  hallucination_rate:       { usl: 2.0 }   # unsupported claims per 1,000 words (proposed, OI-3)
  poster_quality_score:     { lsl: 4.0 }
  workflow_success_rate:    { lsl: 95 }
  capability_threshold: 1.0
  confidence: 0.95
  bootstrap_reps: 2000

review_routing:                   # OI-5: confirm before full run
  near_limit_band:
    key_information_coverage: [80, 100]
    poster_quality_score: [3.5, 4.5]
  judge_disagree_margin:
    key_information_coverage: 15
    poster_quality_score: 1.0
  random_audit_share: 0.10

spc:
  p_chart_batch_size: 5
  sigma: 3
