# Reference configuration for one experiment. Only `candidates` should differ
# between experiments; changing anything under `fixed` breaks comparability.

experiment:
  name: llm-replacement-v1
  seed: 5300                      # used for blinding/randomization, not generation
  spend_cap_usd: null             # TBD: set from project budget before the full run

fixed:
  paper2poster:
    workflow: latex-only-v2       # summaries + one combined figure/outline call -> local LaTeX
    repo: https://github.com/Paper2Poster/Paper2Poster
    commit: 623d042f283acee782b2644d6abd63f75eccfa1f   # 2026-06-08
    path: vendor/Paper2Poster     # checkout location, relative to harness/
    python: vendor/Paper2Poster/.venv/bin/python   # interpreter with Paper2Poster's requirements
    vision_model: same_as_candidate   # retained for upstream artifact naming; no vision calls
    poster_width_inches: 48
    poster_height_inches: 36
    institution_logo_path: assets/CornellLogo.png   # one fixed logo for every LaTeX poster (OI-18)
    extra_args: []                # any other new_pipeline flags, identical for every run
    patch: patches/p2p-generation-params.patch   # the only allowed change to Paper2Poster (OI-17)
    max_output_tokens: 8192       # sent as max_tokens on every gateway call; Llama 4 Maverick allows at most 8192 (OI-17)
    timeout_s: 3600               # per attempt
    max_parse_attempts: 2         # paper-summary calls per try if the output is unusable (upstream: unbounded)
  # Generation prompts are Paper2Poster's own templates at the pinned commit;
  # the Runner hashes them into prompt_sha256.
  generation:
    temperature: 0                # sent on every candidate call by the patch (OI-17, decided 2026-10-31)
    seed: 5300                    # seeds upstream's section selection when a summary has > 9 sections
  papers_dir: papers/
  n_papers: 30
  attempts_per_pair: 1            # raise if budget allows (see OI-4)
  prices_file: config/prices.yaml

gateway:
  name: cornell-ai-gateway        # Cornell AI Platform -> AI Gateway (assumed LiteLLM proxy)
  api_style: openai               # OpenAI-compatible /v1 endpoints (confirm, OI-16)
  base_url_env: CORNELL_AI_GATEWAY_URL
  api_key_env: CORNELL_AI_GATEWAY_KEY
  timeout_s: 600
  max_transport_retries: 2        # OI-6

candidates:                       # run order = list order (alphabetical)
  - id: claude-opus-5
  - id: gpt-5.6-sol
  - id: meta.llama-4-maverick-17b-instruct
  - id: qwen.qwen3-vl-235b-a22b

judges:
  models:
    - id: gemini-3.5-flash         # Gemini Flash
    - id: openai.gpt-4o           # GPT-4o
  repeats: 2                      # test-retest on the pilot

judge_settings:                   # judge/judge.py; see spec/08_llm_judge.md
  temperature: 0
  max_output_tokens: 8192         # thinking tokens count toward this on Gemini 3.5 Flash
  max_image_px: 2000              # long side of the PNG rendered from the poster PDF
  claims_batch_size: 40           # claims per verification call (the paper is resent per batch)
  paper_char_limit: 400000        # papers longer than this are truncated and flagged
  reference_fallback_chars: 100000  # paper text given to coverage/quality when no reference sheet exists

judge_validation:                 # proposed pass thresholds for the pilot (OI-5)
  item_kappa_min: 0.60
  coverage_icc_min: 0.75
  halluc_icc_min: 0.60
  quality_wkappa_min: 0.60
  quality_within1_min: 0.90
  detection_min: 0.80
  retest_icc_min: 0.80
  evidence_found_min: 0.90

reference_sheets:                 # judge/reference_sheet.py: per-paper checklist answers (OI-20)
  models: [gemini-3.5-flash, openai.gpt-4o]   # both draft each sheet and cross-check the drafts
  excerpt_chars: 2500             # paper text per verified quote, given to the judge for an uncertain item

spec_limits:
  key_information_coverage: { lsl: 90 }
  hallucination_rate:       { usl: 5.0 }   # % of the poster's claims unsupported (charter < 5%; same unit as human scoring, OI-3)
  poster_quality_score:     { lsl: 4.0 }
  workflow_success_rate:    { lsl: 95 }
  capability_threshold: 1.0
  confidence: 0.95
  bootstrap_reps: 2000

analysis:                         # analysis/build_dataset.py, analysis/analyze.py; see spec/05_analysis_spec.md
  calibration_papers: [P06, P11, P13]   # used to tune and check the judge prompts; out of the main comparison
  decision_basis: mean            # mean: 95% CI of the model mean vs the limit; share: CI of the share of posters meeting it
  target_share: 0.75              # used only with decision_basis: share
  min_scored: 5                   # fewer scored posters than this -> inconclusive
  seed: 5300                      # bootstrap

review_routing:                   # OI-5: confirm before full run
  near_limit_band:
    key_information_coverage: [80, 100]
    poster_quality_score: [3.5, 4.5]
  judge_disagree_margin:
    key_information_coverage: 15
    poster_quality_score: 1.0
  random_audit_share: 0.10

spc:
  p_chart_batch_size: 5
  sigma: 3
